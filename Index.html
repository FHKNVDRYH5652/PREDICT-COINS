<html lang="en">
<head>

<style>

<body>

<div class="container">
<h1>210 Human Psychology AI Predictor</h1>

<div class="table-box">
  <h3>Enter Last 20 WINGO Results (0-9)</h3>
  <div id="inputs" class="flex flex-wrap justify-center"></div>
  <div class="text-center">
    <button onclick="predict()">Generate Prediction</button>
  </div>
</div>

<div id="output" class="mb-20"></div>

</div>

<script>
// --- Universal Helpers ---
function isBig(n){ return n >= 5; }
function getColor(n){
  if(n === 0) return "Red+Violet";
  if(n === 5) return "Green+Violet";
  // The numbers 1, 3, 7, 9 are Green. 2, 4, 6, 8 are Red.
  return (n % 2 !== 0) ? "Green" : "Red"; 
}
function last(h){return h[h.length-1];}
function secondLast(h){return h[h.length-2];}
function lastN(h, n){return h.slice(Math.max(0, h.length-n));}
function avg(a){return a.length === 0 ? 0 : a.reduce((x,y)=>x+y,0)/a.length;}
function mode(a){
    if (a.length === 0) return 0;
    let f={}, max=0, res=a[0];
    a.forEach(n=>{ f[n]=(f[n]||0)+1; if(f[n]>max){max=f[n];res=n;} });
    return res;
}
function trendStrength(a){
    let up=0, down=0;
    for(let i=1;i<a.length;i++){
        if(a[i]>a[i-1]) up++;
        else if(a[i]<a[i-1]) down++;
    }
    return up-down;
}
function randomInt(max) {
    return Math.floor(Math.random() * (max + 1));
}
function randomGuess() {
    const num = randomInt(9); // 0-9
    return { bigSmall: isBig(num) ? "Big" : "Small", color: getColor(num), number: num };
}

// --- Mind Storage ---
let minds = {};

// --- Build Input Boxes ---
let boxHTML = "";
for(let i=1;i<=20;i++){
  boxHTML += `<input id="r${i}" maxlength="1" placeholder="${i}" value="${i % 10}"> `;
}
document.getElementById("inputs").innerHTML = boxHTML;


// ----------------------------------------------------
// MINDS 1–20 (Trend Followers)
// ----------------------------------------------------
minds[1] = function(history){ let t = trendStrength(history); let next = last(history) + (t > 0 ? 1 : (t < 0 ? -1 : 0)); next = ((next % 10) + 10) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[2] = function(history){ let arr=lastN(history,3); let t=trendStrength(arr); let next=last(history)+(t>0?1:-1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[3] = function(history){ let arr=lastN(history,10); let t=trendStrength(arr); let next=(last(history)+(t>0?2:-2)); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[4] = function(history){ let arr=lastN(history,7); let at=avg(arr); let next=Math.round(last(history)+(last(history)-at)); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[5] = function(history){ let diff=last(history)-secondLast(history); let next=last(history)+(diff>0?2:1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[6] = function(history){ let t=trendStrength(lastN(history,5)); let next=last(history)+(t>0?1:-1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[7] = function(history){ let t=trendStrength(history); let next=last(history)+(t>0?3:-3); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[8] = function(history){ let dir=history[history.length-1]>history[history.length-2]?1:-1; let next=last(history)+dir; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[9] = function(history){ let dir=(history[19]>history[18]&&history[18]>history[17])?2:-2; let next=last(history)+dir; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[10] = function(history){ let arr=lastN(history,4); let t=trendStrength(arr); let next=last(history)+(t>0?3:-3); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[11] = function(history){ let a=Math.round(avg(lastN(history,10))); let next=Math.round((last(history)+a)/2)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[12] = function(history){ let diff=last(history)-avg(lastN(history,5)); let next=last(history)+Math.sign(diff)*3; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[13] = function(history){ let t=trendStrength(lastN(history,6)); let next=last(history)+(t>0?1:-1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[14] = function(history){ let c=getColor(last(history)); let next=last(history)+(c.includes("Red")?1:2); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[15] = function(history){ let m=mode(lastN(history,7)); let t=trendStrength(history); let next=Math.round((m+last(history)+(t>0?1:-1))/2)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[16] = function(history){ let d=last(history)>history[history.length-2]?-1:1; let next=last(history)+d; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[17] = function(history){ let t=trendStrength(history); let next=last(history)+(t>0?-1:1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[18] = function(history){ let diff=last(history)-secondLast(history); let next=diff>0?last(history):secondLast(history); next%=10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[19] = function(history){ let slope=last(history)-history[history.length-3]; let next=last(history)+Math.sign(slope)*2; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[20] = function(history){ let p=last(history)-avg(lastN(history,8)); let next=last(history)+(p>0?2:-2); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };

// ----------------------------------------------------
// MINDS 21–45 (PATTERN FOLLOWERS) - Completed 25 types
// ----------------------------------------------------
minds[21] = function(history){ let patt = mode(history); let next = (patt + 1) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[22] = function(history){ let next = (10 - last(history)) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[23] = function(history){ let arr = lastN(history,4); let next = arr[0]; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[24] = function(history){ let arr = lastN(history,3); let sum = arr[0] + arr[1] + arr[2]; let next = (10 - (sum % 10)) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[25] = function(history){ let a=history[history.length-4], c=history[history.length-2]; let next = Math.abs(a - c); next%=10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[26] = function(history){ let n1=history[history.length-4],n2=history[history.length-3],n3=history[history.length-2]; let next=(n1+n3-n2+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[27] = function(history){ let diff = last(history)-secondLast(history); let next = last(history)-diff; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[28] = function(history){ let arr = lastN(history,3); let next = (arr[0] + arr[1] + arr[2]) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[29] = function(history){ let arr = lastN(history,4); let next = (arr[0] + arr[2]) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[30] = function(history){ let next = Math.floor(avg(lastN(history,5)))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[31] = function(history){ let m = mode(lastN(history,6)); let next = (m + 3) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[32] = function(history){ let next = (last(history)*2) % 10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[33] = function(history){ let next = (10 - (last(history)%10))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[34] = function(history){ let col = getColor(last(history)); let next = (last(history) + (col.includes("Green")?3:1))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[35] = function(history){ let bigs = lastN(history,6).filter(x=>isBig(x)).length; let sm = 6-bigs; let next = (bigs>sm?7:3)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[36] = function(history){ let arr = lastN(history,8); let avgx = Math.round(avg(arr))%10; let modeX = mode(arr); let next = Math.round((avgx+modeX)/2)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[37] = function(history){ let diff1=last(history)-secondLast(history); let diff2=secondLast(history)-history[history.length-3]; let next = (diff1===diff2)? (last(history)+1)%10 : (last(history)+5)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[38] = function(history){ let arr = lastN(history,3); let next = (arr[2] + arr[0])%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[39] = function(history){ let arr = lastN(history,4); let next = (Math.max(...arr) - Math.min(...arr))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[40] = function(history){ let m = mode(lastN(history,10)); let next = (m+2)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
// --- Remaining Pattern Followers (41-45) ---
minds[41] = function(history){ let diff = last(history)-secondLast(history); let next = last(history)+diff; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[42] = function(history){ let next = history[0]; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[43] = function(history){ let m=mode(lastN(history,5)); let next=m; if(m===last(history)||m===secondLast(history)){next=(last(history)+1)%10;} return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[44] = function(history){ let m=mode(history); return {bigSmall:isBig(m)?"Big":"Small",color:getColor(m),number:m}; };
minds[45] = function(history){ return randomGuess(); }; // Pattern gambler - random guess, just playing the game.

// ----------------------------------------------------
// MINDS 46–65 (FEAR-BASED PLAYERS) - 20 Types
// ----------------------------------------------------
minds[46] = function(history){ let next = randomInt(1) * 2 + 1; return {bigSmall:"Small",color:"Green",number:next}; }; // Small/Red or Small/Green (1, 3) - safer side
minds[47] = function(history){ let t=trendStrength(lastN(history,4)); let next=last(history)+(t>0?-2:2); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[48] = function(history){ let m=mode(lastN(history,10)); let next=(m+5)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Anti-mode
minds[49] = function(history){ let next = randomInt(1) === 0 ? 9 : 0; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Panic: extremes
minds[50] = function(history){ let next=last(history); if(last(history)!==mode(history)){next=(last(history)+2)%10;} return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[51] = function(history){ let same=last(history)===secondLast(history) && last(history)===history[history.length-3]; let next=last(history)+(same?-5:0); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[52] = function(history){ let next = secondLast(history); return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Predicts middle number of V/W
minds[53] = function(history){ let next = randomInt(1) === 0 ? 0 : 9; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[54] = function(history){ let next=(last(history)+randomInt(1)*2-1); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[55] = function(history){ let next=randomInt(1) * 2 + 1; return {bigSmall:"Small",color:getColor(next),number:next}; }; // Small odd numbers (1, 3)
minds[56] = function(history){ let next=randomInt(1) === 0 ? 4 : 6; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Middle safety zone
minds[57] = function(history){ let counts={Red:0,Green:0,Violet:0}; history.forEach(n=>getColor(n).split('+').forEach(c=>counts[c]++)); let modeColor=counts.Red>counts.Green?"Red":"Green"; let modeSize=history.filter(isBig).length>10?"Big":"Small"; let next=modeColor.includes("Red")?2:1; if(modeSize==="Big"){next=next+5;} return {bigSmall:modeSize==="Big"?"Small":"Big",color:modeColor,number:next}; };
minds[58] = function(history){ let m=mode(lastN(history,4)); return {bigSmall:isBig(m)?"Big":"Small",color:getColor(m),number:m}; };
minds[59] = function(history){ let next=Math.round(avg(lastN(history,2)))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[60] = function(history){ let next=0; if(last(history)>secondLast(history) && last(history)>history[history.length-3]){next=1;} return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[61] = function(history){ let same=isBig(last(history))===isBig(secondLast(history))&&isBig(last(history))===isBig(history[history.length-3]); return same?randomGuess():{bigSmall:isBig(last(history))?"Big":"Small",color:getColor(last(history)),number:last(history)}; };
minds[62] = function(history){ let next=secondLast(history); return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[63] = function(history){ let m=mode(lastN(history,10)); let next=(m+5)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[64] = function(history){ let m=mode(history); return {bigSmall:isBig(m)?"Big":"Small",color:getColor(m),number:m}; };
minds[65] = function(history){ let sizeMode=history.filter(isBig).length>10?"Big":"Small"; let next=sizeMode==="Big"?8:1; return {bigSmall:sizeMode,color:getColor((next+5)%10),number:next}; };

// ----------------------------------------------------
// MINDS 66–80 (OVER-CONFIDENT PLAYERS) - 15 Types
// ----------------------------------------------------
minds[66] = function(history){ return {bigSmall:"Big",color:"Green",number:7}; };
minds[67] = function(history){ let counts=Array(10).fill(0); history.forEach(n=>counts[n]++); let min=Math.min(...counts); let least=counts.findIndex(c=>c===min); return {bigSmall:isBig(least)?"Big":"Small",color:getColor(least),number:least}; };
minds[68] = function(history){ let counts=Array(10).fill(0); history.forEach(n=>counts[n]++); let min=Math.min(...counts); let least=counts.findIndex(c=>c===min); return {bigSmall:isBig(least)?"Big":"Small",color:getColor(least),number:least}; }; // Same as 67 for max payout
minds[69] = function(history){ let arr=lastN(history,3); let next=(arr[0]+arr[1]+arr[2])*2%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[70] = function(history){ let t=trendStrength(lastN(history,4)); let next=last(history)+(t>0?3:-3); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[71] = function(history){ let next=randomInt(1)===0?0:5; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Violet
minds[72] = function(history){ let next=(last(history)+5)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[73] = function(history){ let next=history.reduce((a,b)=>a+b,0)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[74] = function(history){ return {bigSmall:"Big",color:"Green",number:9}; };
minds[75] = function(history){ return {bigSmall:"Small",color:"Red+Violet",number:0}; };
minds[76] = function(history){ return {bigSmall:"Big",color:"Red",number:8}; };
minds[77] = function(history){ let m=mode(lastN(history,5)); let next=isBig(m)?m-5:m+5; next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[78] = function(history){ let next=(last(history)*3)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[79] = function(history){ let lastN=last(history); let next= (10-lastN); next=((next%10)+10)%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[80] = function(history){ return {bigSmall:"Small",color:"Green",number:1}; };

// ----------------------------------------------------
// MINDS 81–105 (RANDOM PLAYERS) - 25 Types
// ----------------------------------------------------
minds[81] = function(history){ return randomGuess(); };
minds[82] = function(history){ let next=randomInt(1)===0?3:8; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[83] = function(history){ let next=randomInt(1)*2+1; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; }; // Red or Green equivalent
minds[84] = function(history){ return randomGuess(); }; // Randomness is still random
minds[85] = function(history){ return randomGuess(); }; // Randomness is still random
minds[86] = function(history){ let arr=lastN(history,3); let next=arr[randomInt(2)]; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[87] = function(history){ return {bigSmall:"Small",color:"Red",number:2}; };
minds[88] = function(history){ return {bigSmall:"Big",color:"Red",number:6}; };
minds[89] = function(history){ let next=randomInt(4)*2+1; return {bigSmall:isBig(next)?"Big":"Small",color:"Green",number:next}; }; // Forces Green, random number
minds[90] = function(history){ let next=randomInt(4)*2; return {bigSmall:isBig(next)?"Big":"Small",color:"Red",number:next}; }; // Forces Red, random number
minds[91] = function(history){ let next=randomInt(1)===0?0:5; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[92] = function(history){ let next=randomInt(1)===0?8:9; return {bigSmall:"Big",color:getColor(next),number:next}; };
minds[93] = function(history){ let next=randomInt(1)===0?0:1; return {bigSmall:"Small",color:getColor(next),number:next}; };
minds[94] = function(history){ let next=(last(history)+secondLast(history)+randomInt(5))%10; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[95] = function(history){ return {bigSmall:"Small",color:"Green+Violet",number:5}; };
minds[96] = function(history){ let m=mode(history); let a=Math.round(avg(history)); let next=randomInt(1)===0?m:a; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };
minds[97] = function(history){ let next=randomInt(4)*2; return {bigSmall:isBig(next)?"Big":"Small",color:getColor(next),number:next}; };

// --- FINAL PREDICT FUNCTION ---
function predict(){
  let history = [];
  let validInput = true;
  for(let i=1;i<=20;i++){
    let v = parseInt(document.getElementById("r"+i).value);
    if(isNaN(v) || v < 0 || v > 9){
      validInput = false;
      document.getElementById("r"+i).style.borderColor = "red";
    } else {
      document.getElementById("r"+i).style.borderColor = "#333";
      history.push(v);
    }
  }

  if(!validInput || history.length !== 20){
    document.getElementById("output").innerHTML = `<div class="table-box bg-red-900 border-red-700 mt-5"><p class="text-white text-center"><strong>Error:</strong> Please ensure all 20 inputs are valid numbers between 0 and 9.</p></div>`;
    return;
  }

  let results = runAllMinds(history);

  let html = `<h2>210 Human Psychology AI Results</h2>`;

  let big=0, small=0;
  let red=0, green=0, violet=0;
  let numberCount = Array(10).fill(0);

  results.forEach(r=>{
    if(r.bigSmall === "Big") big++;
    else small++;
    // Count colors based on actual colors, accounting for Violet
    if(r.color.includes("Red")) red++;
    if(r.color.includes("Green")) green++;
    if(r.color.includes("Violet")) violet++;
    numberCount[r.number]++;
  });

  // Calculate percentages
  const totalMinds = results.length;
  const bigP = ((big/totalMinds)*100).toFixed(1);
  const smallP = ((small/totalMinds)*100).toFixed(1);

  html += `
  <div class="table-box">
    <h3 class="!mt-0 !border-0">Aggregated Summary</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
        <!-- Size Prediction -->
        <div class="p-3 bg-gray-800 rounded-lg">
            <p class="text-xl font-bold mb-1 text-yellow-400">BIG / SMALL</p>
            <p>Big: <span class="text-green-400 font-bold">${big} (${bigP}%)</span></p>
            <p>Small: <span class="text-red-400 font-bold">${small} (${smallP}%)</span></p>
        </div>
        
        <!-- Color Prediction -->
        <div class="p-3 bg-gray-800 rounded-lg">
            <p class="text-xl font-bold mb-1 text-yellow-400">COLOR COUNTS</p>
            <p>Red: <span class="text-red-500 font-bold">${red}</span></p>
            <p>Green: <span class="text-green-500 font-bold">${green}</span></p>
            <p>Violet: <span class="text-purple-400 font-bold">${violet}</span></p>
        </div>
        
        <!-- Number Breakdown -->
        <div class="p-3 bg-gray-800 rounded-lg md:col-span-1">
            <p class="text-xl font-bold mb-1 text-yellow-400">NUMBER PREDICTIONS (0-9)</p>
            <div class="text-sm flex flex-wrap justify-center">
                ${numberCount.map((v, i) => `
                    <span class="w-1/5 p-1">
                        <span class="font-bold text-lg ${v === Math.max(...numberCount) && v !== 0 ? 'text-green-400' : 'text-gray-300'}">${i}:</span> ${v}
                    </span>
                `).join('')}
            </div>
        </div>
    </div>
  </div>
  `;

  html += `<h3 class="!mt-8">Individual Player Predictions (Total: ${totalMinds} Minds)</h3>`;
  
  // Create a grid of mind boxes
  results.forEach(r=>{
      // Helper for coloring the output text
      let colorClass = 'text-gray-300';
      if(r.color.includes("Red")) colorClass = 'text-red-400';
      else if(r.color.includes("Green")) colorClass = 'text-green-400';
      else if(r.color.includes("Violet")) colorClass = 'text-purple-400';

      html += `
        <div class="mind-box">
          <b class="text-sm text-white">${r.id}. ${r.id <= 20 ? 'TREND' : r.id <= 45 ? 'PATTERN' : r.id <= 65 ? 'FEAR' : r.id <= 80 ? 'OVER-CONF' : r.id <= 105 ? 'RANDOM' : r.id <= 125 ? 'SKIP' : r.id <= 150 ? 'ANALYSIS' : r.id <= 170 ? 'MANIP' : r.id <= 185 ? 'MONEY' : 'EMOTIONAL'}</b><br>
          <span class="${colorClass} text-base font-bold">${r.bigSmall} | ${r.color} | ${r.number}</span>
        </div>
      `;
  });

  document.getElementById("output").innerHTML = html;
}

// Ensure the code to run all minds is present
function runAllMinds(history){
  let allResults = [];
  for(let i=1;i<=210;i++){
    if(typeof minds[i] === "function"){
      let res = minds[i](history);
      // Basic validation for the output structure
      if (typeof res.number !== 'number' || res.number < 0 || res.number > 9) {
          // Fallback to random guess if logic failed/was complex
          res = randomGuess();
      }
      allResults.push({id:i, bigSmall:res.bigSmall, color:res.color, number:res.number});
    }
  }
  return allResults;
}
